<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/panel.css" />
    <script type="module" src="/src/panel.ts"></script>
  </head>
  <body>
    <header>
      <strong>ISOBMFF Box Inspector</strong>
      <span id="count">0 segments</span>
      <span class="divider"></span>
      <label class="filter"><span class="filter-icon">⌕</span><input id="filter" type="search" placeholder="Filter · name, url, track…" spellcheck="false" /></label>
      <span class="seg" id="kind">
        <button data-kind="all" class="selected">All</button><button data-kind="init">init</button><button data-kind="media">media</button><button data-kind="issues">issues</button>
      </span>
      <span id="status"></span>
      <button id="save">Save all</button>
      <button id="clear">Clear</button>
    </header>
    <main>
      <section id="segments-pane">
        <div id="segments"></div>
        <p id="empty">Waiting for media segments… (only requests made while DevTools is open are captured)</p>
      </section>
      <section id="tree-pane"><div id="tree"></div></section>
      <section id="detail-pane">
        <div id="fields"></div>
        <div id="hex"></div>
      </section>
    </main>
    <details id="timeline-pane" open tabindex="0">
      <summary id="timeline-summary"></summary>
      <div id="timeline"></div>
    </details>
  </body>
</html>
